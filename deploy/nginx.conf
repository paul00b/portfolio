# Le portfolio est un site statique : un index.html unique (tout le JS et le CSS
# sont inlinés par vite-plugin-singlefile) plus le dossier images/.
#
# Il n'y a AUCUNE règle de réécriture ici, et c'est voulu : le mode vit dans le
# hash de l'URL (/#jeu, /#cv), et un hash n'est jamais envoyé au serveur. Toutes
# les URL partageables arrivent donc comme un simple GET /. Pas de fallback SPA
# à maintenir.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1,2 Mo d'index.html qui tombent à ~344 Ko : ça vaut le détour.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Piège nginx : dès qu'un bloc location déclare un add_header, il n'hérite
    # plus d'aucun add_header du bloc parent. Les en-têtes communs sont donc
    # répétés dans chaque location plutôt que factorisés au niveau server.

    location /images/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # Tout le site tient dans index.html : le mettre en cache long, c'est
        # garantir qu'aucune mise à jour n'arrive jamais chez les visiteurs
        # déjà venus. On revalide à chaque fois, le gzip fait le reste.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    # Sonde du healthcheck docker-compose.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Derrière le tunnel, toutes les requêtes semblent venir de cloudflared.
    # Décommenter pour retrouver l'IP réelle du visiteur dans les logs :
    # set_real_ip_from 0.0.0.0/0;
    # real_ip_header CF-Connecting-IP;
}
