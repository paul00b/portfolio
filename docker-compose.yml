services:
  portfolio:
    build: .
    image: portfolio-paulbr:latest
    container_name: portfolio
    restart: unless-stopped
    # Port hôte que le tunnel Cloudflare viendra chercher. Changeable avec
    # PORTFOLIO_PORT=9000 docker compose up -d, si 8088 est déjà pris.
    ports:
      - "${PORTFOLIO_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
